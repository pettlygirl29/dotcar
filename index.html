<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>點點幫你找車</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* Layout: one phone-width column opened from an IG bio link — photo strip, five questions, one send bar pinned to the bottom. */
:root{
  --paper:#f5f6f2; --ink:#13233a; --muted:#56637a; --line:#d8dbd3;
  --sun:#f5b400; --card:#ffffff; --line-green:#06c755;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1624; --ink:#eef1f6; --muted:#9aa6ba; --line:#253247; --sun:#ffc21a; --card:#141f31; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1624; --ink:#eef1f6; --muted:#9aa6ba; --line:#253247; --sun:#ffc21a; --card:#141f31; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:480px;margin:0 auto;padding-block:16px 140px}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.plate{font-family:var(--mono);font-weight:700;letter-spacing:.08em;border:2.5px solid var(--ink);border-radius:6px;padding:1px 9px;background:var(--card);font-size:14px}
.top a{font-size:14px;color:var(--muted)}

.hero{margin-top:14px;border-radius:16px;border:2px solid var(--ink);background:var(--sun);color:#13233a;padding:18px;display:grid;gap:10px;box-shadow:6px 6px 0 var(--ink)}
.hero .hi{font-family:var(--display);font-weight:900;font-size:22px}
.hero .facts{display:flex;flex-wrap:wrap;gap:6px}
.hero .facts span{background:#13233a;color:#fff;border-radius:999px;padding:3px 11px;font-size:14px;font-weight:700}
.hero .intro{font-size:17px;font-weight:700;line-height:1.5}
.hero .promise{font-size:14px;font-weight:500}
h1{font-family:var(--display);font-weight:900;font-size:clamp(30px,8.5vw,40px);line-height:1.2;margin:18px 0 6px;text-wrap:balance}
.sub{margin:0 0 22px;color:var(--muted)}

fieldset{border:0;margin:0 0 22px;padding:0;min-width:0}
legend{font-weight:700;font-size:17px;margin-bottom:10px;padding:0;display:flex;gap:8px;align-items:baseline}
legend .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
legend .opt{font-weight:400;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{padding:9px 15px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;font-size:15px;user-select:none}
.chips input:checked+label{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips input:focus-visible+label{outline:3px solid var(--sun);outline-offset:2px}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font:inherit;background:var(--card);color:var(--ink)}
textarea{min-height:76px;resize:vertical}

.preview{background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:14px;font-size:14.5px;white-space:pre-wrap;word-break:break-word;color:var(--muted)}
.preview b{color:var(--ink)}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .in{max-width:480px;margin:0 auto;display:grid;gap:8px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;border-radius:14px;padding:14px;font-weight:700;font-size:16px;text-decoration:none;border:0;cursor:pointer;font-family:var(--body)}
.btn.line{background:var(--line-green);color:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink);padding:10px;font-size:14px}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <span class="plate">DOT-143</span>
    <a href="https://claude.ai/artifact/Q7LmrGAmnuTmthU2R5BqXQ" target="_blank" rel="noopener">看點點車庫 →</a>
  </div>

  <div class="hero">
    <div class="hi">嗨，我是點點</div>
    <div class="intro">我是一位身高只有 143 公分，且曾經是位聯結車司機</div>
    <div class="facts"><span>桃園中古車</span></div>
    <div class="promise">可配合第三方檢查 · 價錢拆開講 · 不催你</div>
  </div>

  <h1>點點幫你找車</h1>
  <p class="sub">勾 5 題，30 秒。按下面的綠色按鈕，訊息就會直接傳到點點的 LINE。</p>

  <form id="f" novalidate>
    <fieldset>
      <legend><span class="n">01</span>預算大概多少？</legend>
      <div class="chips">
        <input type="radio" name="budget" id="b1" value="30 萬以下"><label for="b1">30 萬以下</label>
        <input type="radio" name="budget" id="b2" value="30～50 萬"><label for="b2">30～50 萬</label>
        <input type="radio" name="budget" id="b3" value="50～80 萬"><label for="b3">50～80 萬</label>
        <input type="radio" name="budget" id="b4" value="80～120 萬"><label for="b4">80～120 萬</label>
        <input type="radio" name="budget" id="b5" value="120 萬以上"><label for="b5">120 萬以上</label>
        <input type="radio" name="budget" id="b6" value="還沒想好"><label for="b6">還沒想好</label>
      </div>
    </fieldset>

    <fieldset>
      <legend><span class="n">02</span>想要哪種車？</legend>
      <div class="chips">
        <input type="radio" name="type" id="t1" value="轎車"><label for="t1">轎車</label>
        <input type="radio" name="type" id="t2" value="休旅車"><label for="t2">休旅車</label>
        <input type="radio" name="type" id="t3" value="掀背小車"><label for="t3">掀背小車</label>
        <input type="radio" name="type" id="t4" value="都可以，幫我推薦"><label for="t4">幫我推薦</label>
      </div>
    </fieldset>

    <fieldset>
      <legend><span class="n">03</span>主要拿來做什麼？<span class="opt">可複選</span></legend>
      <div class="chips">
        <input type="checkbox" name="use" id="u1" value="通勤"><label for="u1">通勤</label>
        <input type="checkbox" name="use" id="u2" value="載家人小孩"><label for="u2">載家人小孩</label>
        <input type="checkbox" name="use" id="u3" value="跑業務"><label for="u3">跑業務</label>
        <input type="checkbox" name="use" id="u4" value="第一台車"><label for="u4">第一台車</label>
        <input type="checkbox" name="use" id="u5" value="出遊露營"><label for="u5">出遊露營</label>
      </div>
    </fieldset>

    <fieldset>
      <legend><span class="n">04</span>什麼時候想買？</legend>
      <div class="chips">
        <input type="radio" name="when" id="w1" value="越快越好"><label for="w1">越快越好</label>
        <input type="radio" name="when" id="w2" value="1 個月內"><label for="w2">1 個月內</label>
        <input type="radio" name="when" id="w3" value="3 個月內"><label for="w3">3 個月內</label>
        <input type="radio" name="when" id="w4" value="先看看"><label for="w4">先看看</label>
      </div>
    </fieldset>

    <fieldset>
      <legend><span class="n">05</span>還有其他需要嗎？<span class="opt">可複選</span></legend>
      <div class="chips">
        <input type="checkbox" name="extra" id="e1" value="需要貸款"><label for="e1">需要貸款</label>
        <input type="checkbox" name="extra" id="e2" value="有舊車想換"><label for="e2">有舊車想換</label>
        <input type="checkbox" name="extra" id="e3" value="想約試駕"><label for="e3">想約試駕</label>
      </div>
    </fieldset>

    <fieldset>
      <legend><label for="name">怎麼稱呼你？</label><span class="opt">可不填</span></legend>
      <input type="text" id="name" placeholder="例如：陳先生、小美" autocomplete="nickname">
    </fieldset>

    <fieldset>
      <legend><label for="note">想補充什麼？</label><span class="opt">可不填</span></legend>
      <textarea id="note" placeholder="例如：想要白色、里程 10 萬公里以下"></textarea>
    </fieldset>

    <fieldset>
      <legend>會傳給點點的訊息</legend>
      <div class="preview" id="out"></div>
    </fieldset>
  </form>
</div>

<div class="bar">
  <div class="in">
    <a class="btn line" id="lineBtn" href="https://line.me/R/oaMessage/@631bmnxl/" target="_blank" rel="noopener">用 LINE 傳給點點</a>
    <div class="row">
      <button class="btn ghost" type="button" id="copy">複製訊息</button>
      <a class="btn ghost" href="https://www.instagram.com/sunny_un012/" target="_blank" rel="noopener">改用 IG 私訊</a>
    </div>
    <p class="hint">LINE 打不開的話，按「複製訊息」，再加 LINE @631bmnxl 貼上。</p>
  </div>
</div>

<script>
(function(){
  const f=document.getElementById('f'),out=document.getElementById('out'),
        lineBtn=document.getElementById('lineBtn'),copy=document.getElementById('copy');
  const one=n=>(f.querySelector('input[name='+n+']:checked')||{}).value;
  const many=n=>[...f.querySelectorAll('input[name='+n+']:checked')].map(x=>x.value);
  let text='';
  function build(){
    const name=document.getElementById('name').value.trim(),note=document.getElementById('note').value.trim();
    const L=['點點你好'+(name?'，我是'+name:'')+'，我想找車：'];
    L.push('・預算：'+(one('budget')||'還沒想好'));
    L.push('・車型：'+(one('type')||'都可以，幫我推薦'));
    const u=many('use'); L.push('・用途：'+(u.length?u.join('、'):'還沒想好'));
    L.push('・想買時間：'+(one('when')||'先看看'));
    const e=many('extra'); if(e.length) L.push('・其他：'+e.join('、'));
    if(note) L.push('・補充：'+note);
    L.push('有適合的車再麻煩跟我說，謝謝！');
    text=L.join('\n');
    out.textContent=text;
    lineBtn.href='https://line.me/R/oaMessage/@631bmnxl/?'+encodeURIComponent(text);
  }
  f.addEventListener('input',build); f.addEventListener('change',build);
  f.addEventListener('submit',e=>e.preventDefault()); build();
  copy.addEventListener('click',()=>{
    const ok=()=>{copy.textContent='已複製';setTimeout(()=>copy.textContent='複製訊息',1800)};
    const fb=()=>{const r=document.createRange();r.selectNodeContents(out);const s=getSelection();s.removeAllRanges();s.addRange(r);copy.textContent='已選取，請長按複製'};
    try{navigator.clipboard.writeText(text).then(ok,fb)}catch(e){fb()}
  });
})();
</script>

</body>
</html>
